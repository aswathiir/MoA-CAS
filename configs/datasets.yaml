# Registry of preprocessing-pipeline targets.
#
# Run:  python scripts/build_manifest.py --config <name>
#       python scripts/build_manifest.py --list
#
# Each entry is either a "mucs" (raw Kaldi, code-switched) or "indicvoices"
# (HF-streamed, monolingual baseline) target. Code-switched and monolingual
# targets are paired per language so degradation monitoring (Shah et al.
# 2020) has a matching clean-speech set for every code-mixed one.

mucs_hi_en_test:
  adapter: mucs
  lang_pair: hi-en
  raw_dir: data/raw/mucs/hi-en/test
  out_wav_dir: data/processed/mucs/hi-en/test
  split: test
  out_manifest: data/manifests/mucs_hi-en_test.jsonl

mucs_hi_en_train:
  adapter: mucs
  lang_pair: hi-en
  # Streamed straight out of the .tar.gz (see extract_kaldi_split_from_tar) —
  # the 90h train split's extracted audio (~18GB) doesn't fit on disk
  # alongside the archive, so raw_dir only needs `transcripts/` extracted
  # ahead of time, not the audio itself.
  tar_path: data/raw/mucs/hi-en/Hindi-English_train.tar.gz
  member_root: train
  raw_dir: data/raw/mucs/hi-en/train
  out_wav_dir: data/processed/mucs/hi-en/train
  split: train
  out_manifest: data/manifests/mucs_hi-en_train.jsonl

mucs_bn_en_test:
  adapter: mucs
  lang_pair: bn-en
  raw_dir: data/raw/mucs/bn-en/test
  out_wav_dir: data/processed/mucs/bn-en/test
  split: test
  out_manifest: data/manifests/mucs_bn-en_test.jsonl

mucs_bn_en_train:
  adapter: mucs
  lang_pair: bn-en
  tar_path: data/raw/mucs/bn-en/Bengali-English_train.tar.gz
  member_root: train
  raw_dir: data/raw/mucs/bn-en/train
  out_wav_dir: data/processed/mucs/bn-en/train
  split: train
  out_manifest: data/manifests/mucs_bn-en_train.jsonl

indicvoices_hi_valid:
  adapter: indicvoices
  lang: hindi
  split: valid
  limit: 200
  out_manifest: data/manifests/indicvoices_hi_valid.jsonl

indicvoices_bn_valid:
  adapter: indicvoices
  lang: bengali
  split: valid
  limit: 200
  out_manifest: data/manifests/indicvoices_bn_valid.jsonl
